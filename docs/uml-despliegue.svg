<text x="1248" y="670" font-family="Poppins" font-size="16" fill="#ffc857" text-anchor="start" font-weight="700">Escenario empresarial real</text>
<text x="1248" y="695" font-family="Poppins" font-size="16" fill="#ffffff" text-anchor="start" >• Un SOC recibe miles de eventos al día.</text>
<text x="1248" y="720" font-family="Poppins" font-size="16" fill="#ffffff" text-anchor="start" >• Singleton: un solo pool compartido evita</text>
<text x="1248" y="745" font-family="Poppins" font-size="16" fill="#ffffff" text-anchor="start" >   abrir cientos de conexiones a MySQL.</text>
<text x="1248" y="770" font-family="Poppins" font-size="16" fill="#ffffff" text-anchor="start" >• Factory Method: un tipo nuevo (p. ej.</text>
<text x="1248" y="795" font-family="Poppins" font-size="16" fill="#ffffff" text-anchor="start" >   MALWARE) = una fábrica nueva, sin tocar</text>
<text x="1248" y="820" font-family="Poppins" font-size="16" fill="#ffffff" text-anchor="start" >   el código existente (abierto/cerrado).</text></svg>